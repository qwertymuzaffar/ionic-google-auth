export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\">\r\n      <ion-back-button></ion-back-button>\r\n    </ion-buttons>\r\n    <ion-title>Sign in User</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <form>\r\n    <ion-row>\r\n      <ion-col>\r\n        <ion-button\r\n          type=\"submit\"\r\n          color=\"danger\"\r\n          (click)=\"authService.googleAuth()\"\r\n          expand=\"block\">\r\n          Login with Google\r\n        </ion-button>\r\n      </ion-col>\r\n    </ion-row>\r\n\r\n  </form>\r\n</ion-content>\r\n";
