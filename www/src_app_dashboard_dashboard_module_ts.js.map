export default "<ion-header>\r\n  <ion-toolbar>\r\n      <ion-buttons slot=\"start\">\r\n        <ion-back-button></ion-back-button>\r\n      </ion-buttons>\r\n    <ion-title>Dashboard</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ng-container *ngIf=\"users && users.length; else noData\">\r\n    <ion-list>\r\n      <ion-item *ngFor=\"let user of users\">\r\n        <ion-label>{{user.displayName}}</ion-label>\r\n        <ion-checkbox slot=\"end\"\r\n                      [(ngModel)]=\"user.isChecked\"></ion-checkbox>\r\n      </ion-item>\r\n      <ion-item>\r\n        <ion-textarea [(ngModel)]=\"text\" placeholder=\"Enter text\"></ion-textarea>\r\n      </ion-item>\r\n    </ion-list>\r\n\r\n    <ion-button (click)=\"sendMessage()\"\r\n                expand=\"block\">Send</ion-button>\r\n\r\n    <ion-button type=\"submit\"\r\n                (click)=\"authService.signOut()\"\r\n                color=\"danger\"\r\n                expand=\"block\">Logout</ion-button>\r\n  </ng-container>\r\n\r\n  <ng-template #noData>\r\n    <div class=\"spinner-group\">\r\n      <ion-spinner class=\"spinner-group__spinner\" name=\"lines\"></ion-spinner>\r\n    </div>\r\n  </ng-template>\r\n</ion-content>\r\n";
